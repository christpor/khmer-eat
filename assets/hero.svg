<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="Khmer Eats — Street food, delivered hot">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FDF8F1"/>
      <stop offset="100%" stop-color="#FBEDDE"/>
    </linearGradient>
    <linearGradient id="flameGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
  </defs>

  <!-- warm cream canvas -->
  <rect width="1200" height="420" rx="24" fill="url(#bg)"/>

  <!-- soft pastel blob accents -->
  <circle cx="1050" cy="70" r="150" fill="#FFE7D1" opacity="0.6"/>
  <circle cx="150" cy="370" r="130" fill="#FFE7D1" opacity="0.5"/>

  <!-- mascot: flame in a rounded white tile, top-center -->
  <g transform="translate(540 46)">
    <rect width="120" height="120" rx="32" fill="#FFFFFF"/>
    <rect x="3" y="3" width="114" height="114" rx="29" fill="none" stroke="#F1DCC6" stroke-width="2"/>
    <g transform="translate(30 30)">
      <path d="M30 60a15 15 0 0 0 15-15c0-8.3-3-12-6-18-6.4-12.8-1.3-24 12-36 3 15 12 29 24 39 12 9.7 18 21 18 33a42 42 0 1 1-84 0c0-6.8 2.3-13.5 6-18a15 15 0 0 0 15 15z"
            fill="url(#flameGrad)"/>
      <circle cx="39" cy="63" r="7.5" fill="#FDBA74" opacity="0.85"/>
    </g>
  </g>

  <!-- title, centered -->
  <text x="600" y="235" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="72" font-weight="bold" fill="#1C1917" letter-spacing="-1">
    Khmer<tspan fill="#EA580C">Eats</tspan>
  </text>

  <!-- tagline, centered -->
  <text x="600" y="290" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#57534E">
    Street food, delivered hot.
  </text>

  <!-- small pills, centered row -->
  <g font-family="Arial, Helvetica, sans-serif" font-size="14">
    <rect x="456" y="320" width="72" height="32" rx="16" fill="#FFFFFF"/>
    <text x="492" y="340" text-anchor="middle" font-weight="bold" fill="#EA580C">EN</text>

    <rect x="540" y="320" width="72" height="32" rx="16" fill="#FFFFFF"/>
    <text x="576" y="340" text-anchor="middle" font-weight="bold" fill="#EA580C">ខ្មែរ</text>

    <rect x="624" y="320" width="120" height="32" rx="16" fill="#FFFFFF"/>
    <circle cx="648" cy="336" r="6" fill="#F59E0B"/>
    <text x="672" y="340" font-weight="bold" fill="#1C1917">4.9 · 2,400+</text>
  </g>
</svg>
