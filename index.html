<!doctype html>
<html lang="en" data-lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Khmer Eats — Street Food, Delivered Hot</title>
    <meta
      name="description"
      content="Khmer street food delivered to your door in under 30 minutes. Phnom Penh, Siem Reap, Battambang."
    />
    <script>
      (function () {
        try {
          var t = localStorage.getItem("khmer-eats-theme") || "light";
          var l = localStorage.getItem("khmer-eats-lang") || "en";
          document.documentElement.setAttribute("data-theme", t);
          document.documentElement.setAttribute("data-lang", l);
          document.documentElement.lang = l;
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Instrument+Serif:ital@0;1&family=Kantumruy+Pro:wght@400;500;700&family=Noto+Sans+Khmer:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
