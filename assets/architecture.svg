<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-label="Khmer Eats architecture — three plain files power the whole demo">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FBF5EE"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="460" rx="24" fill="url(#bg2)"/>

  <text x="600" y="56" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="bold" fill="#1C1917">How it works</text>
  <text x="600" y="88" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#78716C">Three plain files. No framework, no build step.</text>

  <!-- three source files -->
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="70" y="130" width="320" height="120" rx="18" fill="#FFFFFF" stroke="#F1DCC6" stroke-width="2"/>
    <text x="100" y="170" font-size="20" font-weight="bold" fill="#EA580C">index.html</text>
    <text x="100" y="200" font-size="15" fill="#57534E">Structure · bilingual content ·</text>
    <text x="100" y="222" font-size="15" fill="#57534E">inline SVG icon atlas</text>

    <rect x="440" y="130" width="320" height="120" rx="18" fill="#FFFFFF" stroke="#F1DCC6" stroke-width="2"/>
    <text x="470" y="170" font-size="20" font-weight="bold" fill="#EA580C">style.css</text>
    <text x="470" y="200" font-size="15" fill="#57534E">Light + dark themes · Khmer font</text>
    <text x="470" y="222" font-size="15" fill="#57534E">switch · tactile motion</text>

    <rect x="810" y="130" width="320" height="120" rx="18" fill="#FFFFFF" stroke="#F1DCC6" stroke-width="2"/>
    <text x="840" y="170" font-size="20" font-weight="bold" fill="#EA580C">script.js</text>
    <text x="840" y="200" font-size="15" fill="#57534E">EN / ខ្មែរ + theme toggles ·</text>
    <text x="840" y="222" font-size="15" fill="#57534E">cart · live rider animation</text>
  </g>

  <!-- arrows -->
  <g stroke="#D6D3D1" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M390 190h50M760 190h50"/>
  </g>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#D6D3D1"/>
    </marker>
  </defs>

  <!-- output: the browser -->
  <rect x="70" y="300" width="1060" height="120" rx="18" fill="url(#orange)"/>
  <text x="600" y="344" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#FFFFFF">Opens directly in your browser</text>
  <g text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#FFF7ED">
    <text x="300" y="390">🌙 Light / dark</text>
    <text x="600" y="390">🇰🇭 Khmer + English</text>
    <text x="900" y="390">🛵 Live order tracking</text>
  </g>
</svg>
